name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: CGO_ENABLED=0 make build

      - uses: softprops/action-gh-release@v2
        with:
          files: bin/soapstone
          generate_release_notes: true
